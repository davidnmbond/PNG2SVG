<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>PNG to SVG Converter</title>
	<style>
		body {
			font-family: sans-serif;
			padding: 2rem;
			background: #f9f9f9;
			color: #000;
		}
		#controls {
			margin-top: 1rem;
			margin-bottom: 2rem;
			display: flex;
			flex-wrap: wrap;
			gap: 1rem;
		}
		.control {
			display: flex;
			flex-direction: column;
			min-width: 150px;
		}
		#pngPreview {
			margin-top: 1rem;
			margin-bottom: 1rem;
			padding: 2rem;
			border: 2px dashed #888;
			border-radius: 8px;
			text-align: center;
			color: #555;
			background: #f0f0f0;
			cursor: pointer;
			transition: background 0.2s ease;
			flex: 1 1 300px;
		}
		#pngPreview.dragover {
			background-color: #e0eaff;
			border-color: #0078d4;
			color: #0078d4;
		}
		#container {
			display: flex;
			flex-wrap: wrap;
			gap: 2rem;
		}
		.preview {
			flex: 1 1 300px;
			border: 1px solid #ccc;
			background: white;
			padding: 1rem;
		}
		img, svg {
			max-width: 100%;
			height: auto;
		}
		button {
			margin-top: 1rem;
			padding: 0.5rem 1rem;
			font-size: 1rem;
		}
		@media (max-width: 600px) {
			#container {
				flex-direction: column;
			}
		}

		/* Dark mode */
		@media (prefers-color-scheme: dark) {
			body {
				background: #1e1e1e;
				color: #ddd;
			}
			#pngPreview {
				background: #2a2a2a;
				color: #aaa;
				border-color: #555;
			}
			#pngPreview.dragover {
				background-color: #003366;
				color: #66ccff;
			}
			.preview {
				background: #2e2e2e;
				border-color: #444;
			}
			button {
				background: #444;
				color: #fff;
				border: 1px solid #666;
			}
		}
	</style>
</head>
<body>
	<h1>PNG to SVG Converter</h1>
	<input type="file" id="fileInput" accept="image/png" style="display:none;" />
	<div id="controls">
		<div class="control">
			<label for="ltres">Line Threshold (ltres): <span id="ltresVal">1</span></label>
			<input type="range" id="ltres" min="0.1" max="5" step="0.1" value="1">
		</div>
		<div class="control">
			<label for="qtres">Corner Threshold (qtres): <span id="qtresVal">1</span></label>
			<input type="range" id="qtres" min="0.1" max="5" step="0.1" value="1">
		</div>
		<div class="control">
			<label for="pathomit">Path Omit: <span id="pathomitVal">8</span></label>
			<input type="range" id="pathomit" min="0" max="50" step="1" value="8">
		</div>
		<div class="control">
			<label for="colors">Colors: <span id="colorsVal">16</span></label>
			<input type="range" id="colors" min="2" max="64" step="1" value="16">
		</div>
	</div>

	<div id="container">
		<div id="pngPreview" class="preview">
			<h2>PNG Preview</h2>
			<p>No image selected.</p>
		</div>
		<div class="preview" id="svgPreview">
			<h2>SVG Preview</h2>
			<div id="svgContent"><p>No SVG generated yet.</p></div>
			<a id="downloadLink" href="#" download="output.svg" style="display:none;">
				<button>Download SVG</button>
			</a>
		</div>
	</div>

	<canvas id="canvas" style="display:none;"></canvas>

<script src="https://unpkg.com/imagetracerjs@1.2.5/imagetracer_v1.2.5.js"></script>
<script>
	var imageDataURL = null;

	var settings = {
		ltres: 1,
		qtres: 1,
		pathomit: 8,
		numberofcolors: 16,
		colorquantcycles: 3
	};

	function updateSettings()
	{
		settings.ltres = parseFloat(document.getElementById('ltres').value);
		settings.qtres = parseFloat(document.getElementById('qtres').value);
		settings.pathomit = parseInt(document.getElementById('pathomit').value);
		settings.numberofcolors = parseInt(document.getElementById('colors').value);

		document.getElementById('ltresVal').textContent = settings.ltres;
		document.getElementById('qtresVal').textContent = settings.qtres;
		document.getElementById('pathomitVal').textContent = settings.pathomit;
		document.getElementById('colorsVal').textContent = settings.numberofcolors;

		if (imageDataURL)
		{
			loadImageAndTrace(imageDataURL);
		}
	}

	document.getElementById('ltres').oninput = updateSettings;
	document.getElementById('qtres').oninput = updateSettings;
	document.getElementById('pathomit').oninput = updateSettings;
	document.getElementById('colors').oninput = updateSettings;

	document.getElementById('fileInput').addEventListener('change', function(e)
	{
		const file = e.target.files[0];
		if (file) handleFile(file);
	});

	const pngPreview = document.getElementById('pngPreview');

	['dragenter', 'dragover'].forEach(event =>
		pngPreview.addEventListener(event, (e) =>
		{
			e.preventDefault();
			pngPreview.classList.add('dragover');
		})
	);

	['dragleave', 'drop'].forEach(event =>
		pngPreview.addEventListener(event, (e) =>
		{
			e.preventDefault();
			pngPreview.classList.remove('dragover');
		})
	);

	pngPreview.addEventListener('drop', function(e)
	{
		const file = e.dataTransfer.files[0];
		if (file && file.type === 'image/png') handleFile(file);
	});

	function handleFile(file)
	{
		const reader = new FileReader();
		reader.onload = function(evt)
		{
			imageDataURL = evt.target.result;
			loadImageAndTrace(imageDataURL);
		};
		reader.readAsDataURL(file);
	}

	function loadImageAndTrace(dataURL)
	{
		var img = new Image();
		img.onload = function()
		{
			var canvas = document.getElementById('canvas');
			canvas.width = img.width;
			canvas.height = img.height;
			var ctx = canvas.getContext('2d');
			ctx.clearRect(0, 0, canvas.width, canvas.height);
			ctx.drawImage(img, 0, 0);

			document.getElementById('pngPreview').innerHTML = '<h2>PNG Preview</h2><img src="' + dataURL + '" />';

			var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
			var svgString = ImageTracer.imagedataToSVG(imageData, settings);

			document.getElementById('svgContent').innerHTML = svgString;

			var blob = new Blob([svgString], { type: 'image/svg+xml' });
			var url = URL.createObjectURL(blob);
			var link = document.getElementById('downloadLink');
			link.href = url;
			link.style.display = 'inline-block';
		};
		img.src = dataURL;
	}
</script>

</body>
</html>
