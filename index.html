<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>PNG to SVG Converter</title>
	<style>
		body {
			font-family: sans-serif;
			padding: 2rem;
			background: #f9f9f9;
			color: #000;
			text-align: center; /* Center-aligns the title and toolbar */
		}
		#controls {
			margin-top: 1rem;
			margin-bottom: 2rem;
			display: inline-flex; /* Centers the toolbar */
			flex-wrap: wrap;
			gap: 1rem;
			justify-content: center; /* Ensures controls are centered */
		}
		.control {
			display: flex;
			flex-direction: column;
			min-width: 150px;
		}
		#pngPreview, #svgPreview {
			display: flex;
			flex-direction: column;
			justify-content: flex-start; /* Ensures the heading stays at the top */
			align-items: center; /* Centers content horizontally */
			margin-top: 1rem;
			margin-bottom: 1rem;
			padding: 2rem;
			border-radius: 8px;
			text-align: center;
			color: #555;
			background: #f0f0f0;
			cursor: pointer;
			transition: background 0.2s ease;
			flex: 1 1 300px;
			min-height: 200px; /* Ensures a minimum height for smaller images */
			overflow: hidden; /* Prevents content overflow */
		}

		#pngPreview {
			border: 2px dashed #888;
		}

		#svgPreview {
			border: 2px solid #ccc;
		}

		#pngContent, #svgContent {
			display: flex;
			justify-content: center; /* Centers content horizontally */
			align-items: center; /* Centers content vertically */
			width: 100%;
		}

		#pngContent img, #svgContent svg {
			max-width: 100%; /* Ensures the image or SVG does not exceed the container width */
			max-height: 100%; /* Ensures the image or SVG does not exceed the container height */
			height: auto; /* Maintains the aspect ratio */
		}

		#pngPreview h2, #svgPreview h2 {
			margin-bottom: 1rem;
			text-align: center;
		}

		#pngPreview.dragover {
			background-color: #e0eaff;
			border-color: #0078d4;
			color: #0078d4;
		}
		#container {
			display: flex;
			flex-wrap: wrap;
			gap: 2rem;
		}
		.preview {
			flex: 1 1 300px;
			border: 1px solid #ccc;
			background: white;
			padding: 1rem;
		}
		img, svg {
			max-width: 100%;
			height: auto;
		}
		button {
			margin-top: 1rem;
			padding: 0.5rem 1rem;
			font-size: 1rem;
			border-radius: 8px; /* Adds rounded corners */
		}
		@media (max-width: 600px) {
			#container {
				flex-direction: column;
			}
		}

		/* Dark mode */
		@media (prefers-color-scheme: dark) {
			body {
				background: #1e1e1e;
				color: #ddd;
			}
			#pngPreview {
				background: #2a2a2a;
				color: #aaa;
				border-color: #555;
			}
			#pngPreview.dragover {
				background-color: #003366;
				color: #66ccff;
			}
			.preview {
				background: #2e2e2e;
				border-color: #444;
			}
			button {
				background: #444;
				color: #fff;
				border: 1px solid #666;
			}
		}
		button:disabled {
			cursor: not-allowed; /* Prevents the hand cursor */
			opacity: 0.6; /* Makes the button appear disabled */
			}
		#svgContent {
			width: 100%; /* Ensures the SVG scales to fit the container */
			height: 100%; /* Ensures the SVG scales to fit the container */
			display: flex;
			justify-content: center;
			align-items: center;
			overflow: hidden; /* Prevents overflow if the SVG is too large */
		}

		#svgContent svg {
			width: 100%; /* Ensures the SVG scales to fit the container width */
			height: auto; /* Maintains the aspect ratio */
			max-height: 100%; /* Ensures the SVG does not exceed the container height */
		}

		#svgPreview {
			margin-top: 1rem;
			margin-bottom: 1rem;
			padding: 2rem;
			border-radius: 8px;
			background: #f0f0f0;
			border: 2px solid #ccc;
			overflow: hidden; /* Prevents overflow of the SVG */
			display: flex;
			flex-direction: column;
			justify-content: flex-start;
			align-items: center;
		}

		#pngContent {
			width: 100%; /* Ensures the PNG scales to fit the container */
			height: 100%; /* Ensures the PNG scales to fit the container */
			display: flex;
			justify-content: center;
			align-items: center;
			overflow: hidden; /* Prevents overflow if the PNG is too large */
		}

		#svgContent {
			width: 100%; /* Ensures the SVG scales to fit the container */
			height: 100%; /* Ensures the SVG scales to fit the container */
			display: flex;
			justify-content: center;
			align-items: center;
			overflow: hidden; /* Prevents overflow if the SVG is too large */
		}

		#svgContent svg {
			max-width: 100%; /* Ensures the SVG does not exceed the container width */
			max-height: 100%; /* Ensures the SVG does not exceed the container height */
			height: auto; /* Maintains the aspect ratio */
		}

		/* Dark mode */
		@media (prefers-color-scheme: dark) {
			#svgPreview {
				background: #2a2a2a;
				border-color: #444;
				color: #aaa;
			}
		}

		#messageBox {
			margin-top: 2rem;
			padding: 1rem;
			border: 2px solid #ccc;
			border-radius: 8px;
			background: #f9f9f9;
			color: #555;
			text-align: center;
			font-size: 1rem;
		}

		/* Dark mode */
		@media (prefers-color-scheme: dark) {
			#messageBox {
				background: #2a2a2a;
				border-color: #444;
				color: #ddd;
			}
		}

		#messageBox a {
			color: #0078d4;
			text-decoration: none;
			font-weight: bold;
		}

		#messageBox a:hover {
			text-decoration: underline;
		}
	</style>
</head>
<body>
	<h1>PNG to SVG Converter</h1>
	<input type="file" id="fileInput" accept="image/png" style="display:none;" />
	<div id="controls">
		<div class="control">
			<label for="ltres">Line Threshold (ltres): <span id="ltresVal">1</span></label>
			<input type="range" id="ltres" min="0.1" max="5" step="0.1" value="1">
		</div>
		<div class="control">
			<label for="qtres">Corner Threshold (qtres): <span id="qtresVal">1</span></label>
			<input type="range" id="qtres" min="0.1" max="5" step="0.1" value="1">
		</div>
		<div class="control">
			<label for="pathomit">Path Omit: <span id="pathomitVal">8</span></label>
			<input type="range" id="pathomit" min="0" max="50" step="1" value="8">
		</div>
		<div class="control">
			<label for="colors">Colors: <span id="colorsVal">16</span></label>
			<input type="range" id="colors" min="2" max="64" step="1" value="16">
		</div>
		<a id="downloadLink" href="#" download="output.svg">
			<button id="downloadButton" disabled>Download SVG</button>
		</a>
	</div>

	<div id="container">
		<div id="pngPreview" class="preview">
			<h2 id="OriginalPNG">Original PNG</h2>
			<div id="pngContent"><p>Drag PNG file here.</p></div>
		</div>
		<div class="preview" id="svgPreview">
			<h2>SVG Preview</h2>
			<div id="svgContent"><p>No SVG generated yet.</p></div>
		</div>
	</div>

	<div id="messageBox" style="display: none;">
		<p>
			Now that you have an SVG, you will likely need to tidy it up. 
			<a href="https://inkscape.org/" target="_blank" rel="noopener noreferrer">Inkscape</a> 
			is a free vector editing tool that can help you.
		</p>
	</div>

	<canvas id="canvas" style="display:none;"></canvas>

<script src="https://unpkg.com/imagetracerjs@1.2.5/imagetracer_v1.2.5.js"></script>
<script>
	var imageDataURL = null;

	var settings = {
		ltres: 1,
		qtres: 1,
		pathomit: 8,
		numberofcolors: 16,
		colorquantcycles: 3
	};

	function updateSettings()
	{
		settings.ltres = parseFloat(document.getElementById('ltres').value);
		settings.qtres = parseFloat(document.getElementById('qtres').value);
		settings.pathomit = parseInt(document.getElementById('pathomit').value);
		settings.numberofcolors = parseInt(document.getElementById('colors').value);

		document.getElementById('ltresVal').textContent = settings.ltres;
		document.getElementById('qtresVal').textContent = settings.qtres;
		document.getElementById('pathomitVal').textContent = settings.pathomit;
		document.getElementById('colorsVal').textContent = settings.numberofcolors;

		if (imageDataURL)
		{
			loadImageAndTrace(imageDataURL);
		}
	}

	document.getElementById('ltres').oninput = updateSettings;
	document.getElementById('qtres').oninput = updateSettings;
	document.getElementById('pathomit').oninput = updateSettings;
	document.getElementById('colors').oninput = updateSettings;

	document.getElementById('fileInput').addEventListener('change', function(e)
	{
		const file = e.target.files[0];
		if (file) handleFile(file);
	});

	const pngPreview = document.getElementById('pngPreview');

	['dragenter', 'dragover'].forEach(event =>
		pngPreview.addEventListener(event, (e) =>
		{
			e.preventDefault();
			pngPreview.classList.add('dragover');
		})
	);

	['dragleave', 'drop'].forEach(event =>
		pngPreview.addEventListener(event, (e) =>
		{
			e.preventDefault();
			pngPreview.classList.remove('dragover');
		})
	);

	pngPreview.addEventListener('drop', function(e)
	{
		const file = e.dataTransfer.files[0];
		if (file && file.type === 'image/png') handleFile(file);
	});

	function handleFile(file)
	{
		const reader = new FileReader();
		reader.onload = function(evt)
		{
			imageDataURL = evt.target.result;
			loadImageAndTrace(imageDataURL);
		};
		reader.readAsDataURL(file);
	}

	function loadImageAndTrace(dataURL)
	{
		var img = new Image();
		img.onload = function()
		{
			var canvas = document.getElementById('canvas');
			canvas.width = img.width;
			canvas.height = img.height;
			var ctx = canvas.getContext('2d');
			ctx.clearRect(0, 0, canvas.width, canvas.height);
			ctx.drawImage(img, 0, 0);

			document.getElementById('pngPreview').innerHTML = '<h2>Original PNG</h2><img src="' + dataURL + '" />';

			var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
			var svgString = ImageTracer.imagedataToSVG(imageData, settings);

			document.getElementById('svgContent').innerHTML = svgString;

			var blob = new Blob([svgString], { type: 'image/svg+xml' });
			var url = URL.createObjectURL(blob);
			var link = document.getElementById('downloadLink');
			link.href = url;

			// Enable the download button
			var downloadButton = document.getElementById('downloadButton');
			downloadButton.disabled = false;

			// Show the message box
			document.getElementById('messageBox').style.display = 'block';
		};
		img.src = dataURL;
	}
</script>

</body>
</html>
